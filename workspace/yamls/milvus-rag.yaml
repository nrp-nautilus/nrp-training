apiVersion: v1
kind: Pod
metadata:
  name: tutorial-<username>-vectordb
  namespace: nrp-training-k8s
spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
          - key: nrp-training
            operator: In
            values: ["true"]
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: nvidia.com/gpu.product
            operator: In
            values:
            - NVIDIA-A10
  tolerations:
  - key: nautilus.io/reservation
    operator: Equal
    value: nrp
    effect: NoSchedule
  volumes:
  - name: scratch
    emptyDir: {}
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: 8Gi
  containers:
  - name: mypod
    image: nvidia/cuda:12.1.0-runtime-ubuntu22.04
    resources:
      limits:
        memory: 24Gi
        cpu: 4
        nvidia.com/gpu: 1
      requests:
        memory: 24Gi
        cpu: 4
        nvidia.com/gpu: 1
    command: ["/bin/bash", "-c"]
    args:
    - >-
        apt update && apt install -y python3 python3-pip wget vim curl zstd git;
        pip3 install --upgrade pip;
        pip3 install -U pymilvus>=2.3.0 sentence-transformers>=2.2.0 torch>=2.0.0 numpy>=1.24.0 langchain>=0.1.0 langchain-community>=0.0.20 langchain-milvus>=0.1.0 langchain-classic>=1.0.0 langchain-text-splitters>=1.0.0 openai>=1.0.0;
        echo "Setup complete! kubectl cp yamls/nrp_docs_rag.py into /scratch, then run: python3 nrp_docs_rag.py --reindex   (see Episode 3 section 5.3)";
        sleep 3600;
    env:
    - name: MILVUS_HOST
      valueFrom:
        secretKeyRef:
          name: nrp-training-milvus-credentials
          key: host
    - name: MILVUS_PORT
      valueFrom:
        secretKeyRef:
          name: nrp-training-milvus-credentials
          key: port
    - name: MILVUS_USER
      valueFrom:
        secretKeyRef:
          name: nrp-training-milvus-credentials
          key: username
    - name: MILVUS_PASSWORD
      valueFrom:
        secretKeyRef:
          name: nrp-training-milvus-credentials
          key: password
    - name: MILVUS_SECURE
      valueFrom:
        secretKeyRef:
          name: nrp-training-milvus-credentials
          key: secure
    - name: MILVUS_DB_NAME
      valueFrom:
        secretKeyRef:
          name: nrp-training-milvus-credentials
          key: database
    - name: OPENAI_API_BASE
      valueFrom:
        secretKeyRef:
          name: nrp-llm-token
          key: OPENAI_API_BASE
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: nrp-llm-token
          key: OPENAI_API_KEY
    volumeMounts:
            - name: scratch
              mountPath: /scratch
            - name: shm
              mountPath: /dev/shm

