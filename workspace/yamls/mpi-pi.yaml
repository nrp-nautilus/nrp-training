# Distributed compute with the Kubeflow MPI operator — computes π with mpirun
# across a launcher + 2 workers. `kubectl apply` needs a fixed name, so <username>
# is substituted in (generateName would require `kubectl create`).
apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: <username>-mpi-pi
  namespace: nrp-training-k8s
spec:
  slotsPerWorker: 1
  runPolicy:
    cleanPodPolicy: Running
    ttlSecondsAfterFinished: 120
  sshAuthMountPath: /home/mpiuser/.ssh
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          tolerations:
          - key: nautilus.io/reservation
            operator: Equal
            value: nrp
            effect: NoSchedule
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                  - key: nrp-training
                    operator: In
                    values: ["true"]
          containers:
          - image: mpioperator/mpi-pi:openmpi
            name: mpi-launcher
            securityContext:
              runAsUser: 1000
            command:
            - mpirun
            args:
            - --map-by
            - ":OVERSUBSCRIBE"
            - -n
            - "2"
            - /home/mpiuser/pi
            resources:
              limits:
                memory: 2Gi
                cpu: 1
              requests:
                memory: 2Gi
                cpu: 1
    Worker:
      replicas: 2
      template:
        spec:
          tolerations:
          - key: nautilus.io/reservation
            operator: Equal
            value: nrp
            effect: NoSchedule
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                  - key: nrp-training
                    operator: In
                    values: ["true"]
          containers:
          - image: mpioperator/mpi-pi:openmpi
            name: mpi-worker
            securityContext:
              runAsUser: 1000
            command:
            - /usr/sbin/sshd
            args:
            - -De
            - -f
            - /home/mpiuser/.sshd_config
            resources:
              limits:
                cpu: 1
                memory: 1Gi
              requests:
                cpu: 1
                memory: 1Gi
